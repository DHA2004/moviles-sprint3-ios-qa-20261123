name: Build submitted Sprint 3 iOS apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Team ${{ matrix.team }} - iOS simulator
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - team: "11"
            repository: CONSTR-APLICACIONES-MOVILES/Sprint-3-Flutter
            commit: 1eb817d0ee3e4be72977e3b70590b9dd63b09e02
            project_path: ParchApp-Flutter
          - team: "13"
            repository: Moviles-G13-S1/whynot-front-flutter
            commit: 4ee455adab238a1182b5e2daaed072de82d6ad42
            project_path: .
    steps:
      - name: Fetch original submitted source without changing student repositories
        env:
          SOURCE_REPOSITORY: ${{ matrix.repository }}
          SOURCE_COMMIT: ${{ matrix.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPOSITORY.git"
          git -C source fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Fetch Flutter 3.47.4 from the verified official commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth=1 origin 9584c6713b324636289d067944a46fd6b49df14b
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/flutter" tag 3.47.4 9584c6713b324636289d067944a46fd6b49df14b
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Record the build environment
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          dart --disable-analytics
          flutter --version
          xcodebuild -version
          uname -m
      - name: Build and package for an iOS simulator
        working-directory: source/${{ matrix.project_path }}
        env:
          TEAM: ${{ matrix.team }}
          SOURCE_REPOSITORY: ${{ matrix.repository }}
          SOURCE_COMMIT: ${{ matrix.commit }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-codesign
          destination="$GITHUB_WORKSPACE/outputs/Team$TEAM"
          mkdir -p "$destination"
          app_bundle="$(find build/ios/iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$destination/Team${TEAM}_Sprint3_iOS_Simulator.zip"
          shasum -a 256 "$destination/Team${TEAM}_Sprint3_iOS_Simulator.zip" > "$destination/SHA256.txt"
          {
            echo "Source repository: $SOURCE_REPOSITORY"
            echo "Original source commit: $SOURCE_COMMIT"
            echo "Flutter commit: 9584c6713b324636289d067944a46fd6b49df14b (3.47.4)"
            echo "No original repository or source file intentionally modified."
            echo "Rebuilt simulator app; not the original signed device binary."
            echo "No physical iPhone validation is established by this build."
          } > "$destination/BUILD_PROVENANCE.txt"
      - name: Keep simulator app for private test-session upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Team${{ matrix.team }}-Sprint3-iOS-Simulator
          path: outputs/Team${{ matrix.team }}/
          retention-days: 7
          if-no-files-found: error
